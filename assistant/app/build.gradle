plugins {
    id 'com.android.application'
}

// Read secrets from local.properties (gitignored) so they never get committed.
// Falls back to empty/defaults, so the project always builds out of the box.
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def anthropicKey = localProps.getProperty("ANTHROPIC_API_KEY", "")
def anthropicModel = localProps.getProperty("ANTHROPIC_MODEL", "claude-haiku-4-5")
def backendUrl = localProps.getProperty("BACKEND_URL", "")
def supabaseUrl = localProps.getProperty("SUPABASE_URL", "")
def supabaseAnonKey = localProps.getProperty("SUPABASE_ANON_KEY", "")

android {
    namespace 'com.aiassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.aiassistant"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "ANTHROPIC_API_KEY", "\"${anthropicKey}\""
        buildConfigField "String", "ANTHROPIC_MODEL", "\"${anthropicModel}\""
        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Debug build — installs with the default debug signing key.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android framework
// (org.json is part of the platform) so there is nothing to download.
dependencies {
}
