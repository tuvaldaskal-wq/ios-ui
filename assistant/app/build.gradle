plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aiassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.aiassistant"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Debug build — installs with the default debug signing key.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android framework
// (org.json is part of the platform) so there is nothing to download.
dependencies {
}
